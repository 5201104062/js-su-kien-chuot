<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiệu chỉnh theo sự kiện chuột</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hiệu chỉnh theo sự kiện chuột</h1>

  <div class="luoi">
    <div class="khung">
      <h2>1. Di chuột vào thẻ &lt;div&gt;</h2>
      <div id="hop-hover">Hover Me</div>
    </div>

    <div class="khung">
      <h2>2. Di chuột vào hình ảnh để phóng to 10%</h2>
      <div class="vung-anh">
        <img id="hinh-anh" src="phong-canh.svg" width="240" alt="Tranh phong cảnh">
      </div>
    </div>

    <div class="khung">
      <h2>3. Nhấn nút để xem ngày giờ hiện tại</h2>
      <button id="nut-ngay-gio">Xem ngày giờ</button>
    </div>

    <div class="khung">
      <h2>4. Chuyển nội dung ô nhập sang chữ IN HOA</h2>
      <div class="hang">
        <input type="text" id="o-chu" value="xin chào javascript">
        <button id="nut-in-hoa">IN HOA</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
